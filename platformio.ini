[platformio]
src_dir = Src
default_envs = two_hall

[env]
platform = ststm32
framework = stm32cube
board = genericSTM32F103RC
debug_tool = stlink
upload_protocol = stlink
monitor_speed = 115200
build_flags =
    -DUSE_HAL_DRIVER
    -DSTM32F103xE
    -DVARIANT_USART
    -T./STM32F103RCTx_FLASH.ld
    -lc
    -lm
    -g
    -ggdb

[env:two_hall]
extends = env
build_flags =
    ${env.build_flags}
    -DHW_PROFILE_TWO_HALL

[env:enc_hall]
extends = env
build_flags =
    ${env.build_flags}
    -DHW_PROFILE_ENC_HALL
