[platformio]
src_dir = Src
default_envs = APP_STLINK

[common]
platform = ststm32
framework = stm32cube
board = genericSTM32F103RC
monitor_speed = 2000000
build_src_flags =
    -Wall
    -Wextra
    -Werror
build_flags =
    -I.
    -ISrc
    -DUSE_HAL_DRIVER
    -DSTM32F103xE
    -DVARIANT_USART
    -lc
    -lm

[env:APP_STLINK]
board_build.ldscript = STM32F103RCTx_APP.ld
platform = ${common.platform}
framework = ${common.framework}
board = ${common.board}
debug_tool = stlink
upload_protocol = stlink
monitor_speed = ${common.monitor_speed}
build_src_flags = ${common.build_src_flags}
build_src_filter = +<*> -<bootloader/>
build_flags = ${common.build_flags}
    -DVECT_TAB_OFFSET=0x00002800U

[env:APP_USART_PC]
board_build.ldscript = STM32F103RCTx_APP.ld
platform = ${common.platform}
framework = ${common.framework}
board = ${common.board}
upload_protocol = custom
upload_port = /dev/ttyUSB_F103
monitor_speed = ${common.monitor_speed}
build_src_flags = ${common.build_src_flags}
build_src_filter = +<*> -<bootloader/>
build_flags = ${common.build_flags}
    -DVECT_TAB_OFFSET=0x00002800U
upload_command = $PYTHONEXE tools/pio_vesc_upload.py --transport serial --serial-port $UPLOAD_PORT --baud 2000000 --firmware $SOURCE

[env:APP_F411]
board_build.ldscript = STM32F103RCTx_APP.ld
platform = ${common.platform}
framework = ${common.framework}
board = ${common.board}
upload_protocol = custom
monitor_speed = ${common.monitor_speed}
build_src_flags = ${common.build_src_flags}
build_src_filter = +<*> -<bootloader/>
build_flags = ${common.build_flags}
    -DVECT_TAB_OFFSET=0x00002800U
upload_command = $PYTHONEXE tools/pio_vesc_upload.py --transport tcp --host 127.0.0.1 --port 65102 --firmware $SOURCE

[env:BOOTLOADER_STLINK]
board_build.ldscript = STM32F103RCTx_BOOTLOADER.ld
platform = ${common.platform}
framework = ${common.framework}
board = ${common.board}
debug_tool = stlink
upload_protocol = stlink
monitor_speed = ${common.monitor_speed}
build_src_flags = ${common.build_src_flags}
build_src_filter = +<bootloader/>
build_flags = ${common.build_flags}
